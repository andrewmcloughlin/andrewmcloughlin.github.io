<svg width="839" height="579" class="hero-img" viewBox="0 0 839 579" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    .hero-img .stroke-charcoal { 
      stroke: var(--zen-charcoal); 
      stroke-width: 3.14159px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
      }
    .hero-img .fill-charcoal   { fill: var(--zen-charcoal); transition: fill 0.2s ease; }
    .hero-img .lamp { cursor: pointer; }
    .hero-link { cursor: pointer; pointer-events: all; }
    .hero-link * { pointer-events: all; }
    .hero-link:hover .stroke-charcoal { stroke: var(--accent-color); }
    .hero-link:hover .fill-charcoal   { fill:   var(--accent-color); }
  </style>
  <defs>
    <filter id="turbulence-filter" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse">

      <feTurbulence 
        type="fractalNoise" 
        baseFrequency="0.03" 
        numOctaves="1" 
        seed="42"
        result="noise">
        <animate 
          attributeName="baseFrequency" 
          dur="5s" 
          values="0.03; 0.06; 0.03" 
          repeatCount="indefinite" />
      </feTurbulence>

      <feDisplacementMap 
        in="SourceGraphic" 
        in2="noise" 
        scale="10" 
        xChannelSelector="R" 
        yChannelSelector="G"/>
    </filter>
  </defs>


