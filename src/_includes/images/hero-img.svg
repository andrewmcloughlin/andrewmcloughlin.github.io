<svg xmlns="http://www.w3.org/2000/svg" width="415" height="275" fill="none" class="hero-img" viewBox="0 0 415 275">
  <style>
    .hero-img .stroke-charcoal { stroke: var(--zen-charcoal); }
    .hero-img .fill-charcoal   { fill:   var(--zen-charcoal); }
  </style>
  <defs>
    <filter id="turbulence-filter" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse">
      <!-- Creates the noise texture. 
           - baseFrequency: 0.03 is the "grain size". Lower = smoother waves.
           - numOctaves: 1 keeps the texture simple.
           - type="fractalNoise": gives a cloudy, organic look. -->
      <feTurbulence 
        type="fractalNoise" 
        baseFrequency="0.03" 
        numOctaves="1" 
        seed="1"
        result="noise">
        
        <!-- ANIMATE THE NOISE:
             This makes the pattern bubble and shift continuously.
             We animate 'baseFrequency' so the waves stretch and compress over time.-->
        <animate 
          attributeName="baseFrequency" 
          dur="5s" 
          values="0.03; 0.06; 0.03" 
          repeatCount="indefinite" />
      </feTurbulence>

      <!-- APPLIES THE NOISE TO THE STEAM:
           - in="SourceGraphic": The steam lines are the input.
           - in2="noise": The feTurbulence above is the map.
           - scale="5": How many pixels the steam will wobble sideways.
           - x/yChannelSelector: Maps Red channel to X-axis, Green to Y. -->
      <feDisplacementMap 
        in="SourceGraphic" 
        in2="noise" 
        scale="10" 
        xChannelSelector="R" 
        yChannelSelector="G"/>
    </filter>
  </defs>


